# Runs leetsay's tests on every push. They need no microphone, no network
# (leetsay's own network block stays closed) and no speech model.
name: Tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the packages (exact versions, each checked by its fingerprint)
        # (On its own line: ":all: " on the same line as "run:" breaks the file.)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-build.txt

      - name: Run the tests
        run: python -B -m unittest discover -s tests -v
