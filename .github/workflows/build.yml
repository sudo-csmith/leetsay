# Builds leetsay.exe and the Windows installer.
# - "Run workflow" on the Actions tab: builds, and keeps the installer as a
#   downloadable file on that run's page (for testing).
# - Pushing a tag such as v0.1.0: also publishes a GitHub Release with the
#   installer and its SHA-256 fingerprint attached.
name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to publish a release for a tag
  id-token: write          # signing: GitHub's own sign-in to Azure (no stored password)

jobs:
  build:
    runs-on: windows-latest
    # Signing is allowed only from this repository's "signing" environment
    # (main and v* tags); the Azure side trusts nothing else.
    environment: signing
    steps:
      - uses: actions/checkout@v6
        with:
          # The write key is not left on disk for the build steps (installers,
          # packages); only the publish step below gets it, as GH_TOKEN.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the packages (exact versions, each checked by its fingerprint)
        # (On its own line: ":all: " on the same line as "run:" breaks the file.)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-build.txt

      - name: Read the version from leetsay.pyw
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path leetsay.pyw -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not $v) { throw "VERSION not found in leetsay.pyw" }
          "value=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "The tag $env:GITHUB_REF_NAME does not match VERSION $v in leetsay.pyw"
          }

      - name: Build leetsay.exe
        run: pyinstaller --noconfirm leetsay.spec

      - name: Check the licences and the bundled files
        shell: pwsh
        run: |
          $lic = "dist\leetsay\licenses"
          Get-ChildItem $lic | Select-Object -ExpandProperty Name
          foreach ($need in "LGPL-3.0.txt", "GPL-3.0.txt", "Apache-2.0.txt", "PortAudio-LICENSE.txt", "Silero-VAD-LICENSE.txt", "Qt-third-party.txt", "Qt-third-party-full.txt", "onnxruntime-onnxruntime-ThirdPartyNotices.txt", "numpy-licenses-LICENSE.txt", "Python-LICENSE.txt", "leetsay-LICENSE.txt", "CREDITS.md") {
            if (-not (Test-Path "$lic\$need")) { throw "Missing licence file: $need" }
          }
          $asio = Get-ChildItem dist\leetsay -Recurse -Filter "*asio*"
          if ($asio) { throw "ASIO files must not be bundled: $($asio.Name -join ', ')" }
          $commercial = Get-ChildItem $lic -Filter "*Commercial*"
          if ($commercial) { throw "Qt's commercial licence text must not be bundled: $($commercial.Name -join ', ')" }

      # Code signing with Azure Artifact Signing. Only our own files are signed
      # (leetsay.exe, the installer, its helper and the uninstaller); bundled
      # third-party files keep their makers' own signatures, or none.
      - name: Sign in to Azure (GitHub's own sign-in; no password is stored)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get the signing tools (exact versions)
        id: sign
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "signing"
          nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.28000.2957 -OutputDirectory $d -NonInteractive | Out-Null
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.151 -OutputDirectory $d -NonInteractive | Out-Null
          $tool = Get-ChildItem $d -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          $dlib = Get-ChildItem $d -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $tool -or -not $dlib) { throw "The signing tools were not found" }
          $meta = Join-Path $d "metadata.json"
          @{
            Endpoint = "https://eus.codesigning.azure.net"
            CodeSigningAccountName = "leetsay-signing"
            CertificateProfileName = "leetsay"
            # Only the Azure sign-in above is used.
            ExcludeCredentials = @("EnvironmentCredential", "ManagedIdentityCredential",
              "WorkloadIdentityCredential", "SharedTokenCacheCredential", "VisualStudioCredential",
              "VisualStudioCodeCredential", "AzurePowerShellCredential",
              "AzureDeveloperCliCredential", "InteractiveBrowserCredential")
          } | ConvertTo-Json | Set-Content $meta -Encoding utf8NoBOM
          "tool=$($tool.FullName)" >> $env:GITHUB_OUTPUT
          "dlib=$($dlib.FullName)" >> $env:GITHUB_OUTPUT
          "meta=$meta" >> $env:GITHUB_OUTPUT

      - name: Sign leetsay.exe
        shell: pwsh
        run: |
          & "${{ steps.sign.outputs.tool }}" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib "${{ steps.sign.outputs.dlib }}" /dmdf "${{ steps.sign.outputs.meta }}" dist\leetsay\leetsay.exe
          if ($LASTEXITCODE -ne 0) { throw "Signing leetsay.exe failed" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer (installer, setup helper and uninstaller signed)
        shell: pwsh
        run: |
          # Inno Setup runs this for each file it signs: $q is a quote, $f the file.
          $cmd = '$q' + "${{ steps.sign.outputs.tool }}" + '$q sign /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $q' + "${{ steps.sign.outputs.dlib }}" + '$q /dmdf $q' + "${{ steps.sign.outputs.meta }}" + '$q $f'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" /DSign "/Sazure=$cmd" installer\leetsay.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Check the signatures
        shell: pwsh
        run: |
          foreach ($f in "dist\leetsay\leetsay.exe", "Output\leetsay-setup.exe") {
            $s = Get-AuthenticodeSignature $f
            "{0}: {1}" -f $f, $s.Status          # (the public log never shows the certificate's details)
            if ($s.Status -ne "Valid") { throw "$f is not validly signed" }
            if (-not $s.TimeStamperCertificate) { throw "$f has no time stamp" }
          }

      - name: Fingerprint (SHA-256)
        shell: pwsh
        run: |
          Get-ChildItem Output\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content Output\SHA256SUMS.txt -Encoding ascii
          Get-Content Output\SHA256SUMS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: leetsay-setup-${{ steps.version.outputs.value }}
          path: Output/*

      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sum = Get-Content Output\SHA256SUMS.txt -Raw
          $notes = @"
          leetsay ${{ steps.version.outputs.value }}: local dictation for Windows.

          Download **leetsay-setup.exe** below and run it. The installer is not yet signed, so Windows may show "Windows protected your PC": choose **More info**, then **Run anyway**. See the README for details.

          **"Smart App Control blocked an app".** On PCs with Smart App Control switched on, Windows blocks every unsigned app, with no way to allow a single one, so leetsay cannot be installed there until it is signed (being worked on). See "Smart App Control" in the README for your options.

          **Optional check: the SHA-256 fingerprint.** The code below is worked out from every byte of the installer. If the file were changed or damaged in any way, the code would be completely different. To compare: open your Downloads folder, right-click an empty spot, choose **Open in Terminal**, type ``Get-FileHash .\leetsay-setup.exe`` and press Enter. The code after **Hash** should match this one (capital or small letters don't matter). If it doesn't, don't run the file; download it again.
          ``````
          $sum
          ``````
          "@
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem Output\*).FullName --title "leetsay ${{ steps.version.outputs.value }}" --notes $notes
